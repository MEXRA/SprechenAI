services:
  postgres:
    image: postgres:16-alpine
    container_name: sprechenai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sprechenai}
      POSTGRES_USER: ${POSTGRES_USER:-sprechenai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sprechenai_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sprechenai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sprechenai_postgres_data:

